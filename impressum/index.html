<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Impressum – Kochy's Ratingen</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<style>
@font-face{font-family:Outfit;src:url(../fonts/outfit.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Fredoka;src:url(../fonts/fredoka.woff2) format("woff2");font-weight:300 700;font-display:swap}
:root{--ink:#161310;--muted:#6e665e;--line:#ece5dc;--soft:#f7f3ee;--brown:#643d11;--sand:#c8a175;--acc:#f7a35c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--brown)}
.stripe{height:4px;background:linear-gradient(90deg,var(--brown) 0 33.3%,var(--sand) 33.3% 66.6%,var(--acc) 66.6%)}
header{border-bottom:1px solid var(--line)}
.bar{max-width:820px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.bar img{height:30px;width:auto;display:block}
.bar a.back{font-weight:600;text-decoration:none;font-size:15px}
main{max-width:820px;margin:0 auto;padding:40px 20px 72px}
h1{font-family:Fredoka,Outfit,sans-serif;font-weight:600;color:var(--brown);font-size:clamp(30px,5vw,40px);line-height:1.15;margin-bottom:24px}
h2{font-size:19px;font-weight:700;margin:32px 0 10px}
h3{font-size:16px;font-weight:700;margin:20px 0 6px}
p,li{color:#3d3833;margin-bottom:10px}
ul{padding-left:22px;margin-bottom:10px}
li{margin-bottom:4px}
.box{background:var(--soft);border-radius:16px;padding:20px 22px;margin-bottom:8px}
.box p:last-child{margin-bottom:0}
.caps{font-size:14.5px}
.stand{color:var(--muted);font-size:14px;margin-top:32px}
footer{border-top:1px solid var(--line)}
footer .bar{height:auto;padding:24px 20px 40px;font-size:14px;color:var(--muted);flex-wrap:wrap}
footer nav{display:flex;gap:20px}
footer nav a{color:var(--muted);text-decoration:none}
footer nav a:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="stripe"></div>
<header><div class="bar"><a href="../" aria-label="Zur Startseite"><img src="../img/logo-900.png" alt="Kochy's" width="900" height="192"></a><a class="back" href="../">← Zur Startseite</a></div></header>
<main>
<h1>Impressum</h1>
<h2>Angaben gemäß § 5 DDG</h2>
<div class="box">
<p><b>Kochy's</b><br>Inh. Arzu Tokat<br>Dieselstraße 1a<br>40880 Ratingen</p>
</div>
<h2>Kontakt</h2>
<p>Telefon: <a href="tel:+4921025589497">02102 5589497</a><br>E-Mail: <a href="mailto:info@kochys-ratingen.de">info@kochys-ratingen.de</a><br>Web: www.kochys-ratingen.de</p>

<footer><div class="bar"><span>© Kochy's · Dieselstraße 1A · 40880 Ratingen</span><nav><a href="../">Startseite</a><a href="../impressum/">Impressum</a><a href="../datenschutz/">Datenschutz</a></nav></div></footer>
</body>
</html>
